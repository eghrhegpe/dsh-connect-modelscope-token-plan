# dsh-connect-modelscope-token-plan — the bundle's own patch layer.
#
# 在 Plugins 页的插件卡里展示魔搭 API-Inference 免费额度的**本地用量面板**，
# 并可选把魔搭注册成 OpenAI 兼容 LLM provider。以下全是普通配置：在这里改
# （或在 profile 的 cordis.patch.yml 里覆盖同 id 字段）后重装/重载生效。
#
# 魔搭访问令牌（个人中心「访问令牌」，形如 ms-…）不在这里配置：插件读 DSH
# 凭据服务里的 MODELSCOPE_API_KEY 引用（面板保存即生效）。环境变量
# MODELSCOPE_API_KEY 只在启动时读一次、且优先级高于引用值——设了它就别再用面板存
# （见 README「凭据分层有个坑」与 ms-auth.ts 文件头）。见 docs/SPIKE.md 与 README.md。
- insert:
    - id: dsh-connect-modelscope-token-plan
      name: dsh-connect-modelscope-token-plan
      config:
        # OpenAI 兼容推理源站（模型目录 + 探测/计数）。平台搬端点时才需要动。
        apiBase: https://api-inference.modelscope.cn/v1
        # 站点源站，只用于面板里的外链（访问令牌页 / 文档页）。
        siteBase: https://modelscope.cn
        # ------------------------------------------------------------------
        # 面板头条是**官方魔粒余额**（balance 路由，真实值），所以这里**没有**
        # 额度常数：官方改按「魔粒」计费后，次数口径的「每日 N 次 / 推算剩余」
        # 是社区快照而非官方数据，与魔粒余额并排展示会误导（README「三条事实」
        # 第 2 条）。早期版本里的 dailyQuotaTotal / dailyQuotaPerModel 已随之
        # 删除——留着它们只会让人以为面板能算「还剩几次」，而它算不出。
        # 本地计数的独家价值在分布 / 趋势 / 429 事件流，不在「离上限多远」。
        # ------------------------------------------------------------------
        # 趋势图显示天数（面板标题「近 N 天」与图上柱数）——面板里可改看多长。
        trendDays: 14
        # 本地趋势**保留**天数（插件私有状态文件里的天桶数量，与上游无关）。
        # 独立于 trendDays：显示只决定「画多少」，保留决定「留多少」。留得比画得多，
        # 面板才可能让你把窗口调到更远。显示窗口恒被硬夹在保留之内。
        retentionDays: 90
        # 429/错误事件环形缓冲的上限（面板只展示最近的）。上界 1000，硬夹。
        maxEvents: 50
        # 单模型「额度耗尽」推断窗口（分钟）。官方只有账户级魔粒余额、没有
        # per-model 额度端点，所以「哪个模型刚才在限频」从本插件的 429 事件流
        # 推断（纯函数见 src/host/usage-store.ts 的 exhaustedModelIds）：某模型
        # 最近在这个窗口内出现过 kind=quota 的事件（重分类后的口径——被误判成
        # QUOTA 的 rpm 限频已在此之前纠正为 rate_limit，不算证据），选择器就不再
        # 提供它、面板 roster 灰显；事件移出窗口即恢复。**恢复不可观测是已知
        # 代价**：成功的调用不发事件，额度若在窗口内恢复（按天重置恰好如此），
        # 模型最多灰显满一个窗口——方向保守（不提供注定 429 的模型），且灰显
        # 带着原因。下界 5 分钟（再短规则形同虚设），上界 1440（一天，额度按天
        # 重置，更长的窗口没有对应的恢复语义）。硬夹。
        exhaustionWindowMinutes: 60
        # Host 侧对 /v1/models 的缓存秒数；面板脚注直接引用此值。上界 600。
        cacheSeconds: 60
        # 面板轮询间隔，由 Host 下发、面板跟随。上界 3600（1 小时）。
        # ⚠️ 别把这两个值调大到「几小时」：pollSeconds × 1000 超过 2^31-1 ms 时
        # Node 会把 setInterval 的延时**钳到 1ms**（TimeoutOverflowWarning），插件
        # 于是变成每毫秒打一次魔搭目录。上界是硬夹的，越界值会被拉回上限。
        pollSeconds: 30
        # 单次魔搭请求超时（毫秒）。上界 600000（10 分钟）——同样是硬夹。
        inferenceTimeoutMs: 30000
        # ------------------------------------------------------------------
        # 把魔搭注册成 DSH 的 LLM provider（id `modelscope-token-plan`，直连
        # apiBase，OpenAI 兼容）。默认关（opt-in，与姊妹插件一致）；面板「模型」
        # tab 的「接入为 DSH 模型」开关可随时翻转，面板保存值优先于这里的默认。
        # 注册后魔搭模型进入 DSH 模型选择器。
        #
        # 计数范围：注册开关打开后，本客户端（本 profile）的魔搭对话经本插件的
        # 适配器出去，每一次调用与每一条 429/错误事件都由 src/host/usage-observer.ts
        # 在流的出口记进同一个 usage-store。口径是**本客户端**：桌面端与 Web 端是
        # 两个 profile，各记各的账、互不可见（`npm run doctor` 并排列出各 profile），
        # 别把它当跨端总量。直连魔搭的其它客户端同样不计入（本插件看不见它们），
        # 消耗总量以官方魔粒余额为准。
        #
        # 偏差方向是**按流计次**：重试不在流内部发生，而是流被消费完后由
        # agent/request-error 瀑布决定重发，因而每次重试各记一次（按「魔搭按
        # 次数计费」的口径这反而是对的）。详见 src/host/usage-observer.ts 文件头
        # 与 README「诚实声明」。
        registerProvider: false
        # ------------------------------------------------------------------
        # 给 agent 注册出图工具（`modelscope_draw_image`）。**与上面的
        # registerProvider 是两条独立开关**：那个管「魔搭作为 chat provider」，
        # 这个管「agent 能不能出图」。默认同样关（opt-in）。
        #
        # 实测要点（docs/SPIKE-image-gen.md）：
        #   · 上游是**异步两段式**：提交拿 task_id，再带
        #     `X-ModelScope-Task-Type: image_generation` 轮询到终态；
        #   · 提交响应里的 task_status 恒为 SUCCEED 且**不可信**，成功只看轮询终态；
        #   · 耗时不稳（实测 61s–537s，免费池排队），故超时取 15 分钟；
        #   · 出图**不扣**魔粒（chat 才扣，1 次 = 1 魔粒），所以面板刻意**不显示**
        #     出图计数——那会变成拿 chat 的口径给生图记账。
        #
        # 生效时机：开关值立即保存，但**工具的挂载发生在下次 Host 启动**——
        # peer 的 tools registry 没有 unregister，工具一旦注册就摘不下来。
        # 面板会就这一点给出提示（draw.restartHint）。
        drawEnabled: false
        # 出图默认模型（空 = 自动取目录里第一个出图模型）。
        # 注意只有目录内**平台声明**出图能力的模型才进候选：实测目录 35 条里
        # 只有 2 条 image-to-image（Qwen/Qwen-Image-Edit、MusePublic/…），
        # 没有任何 text-to-image。官方示例里的 Qwen/Qwen-Image-2.1-Turbo 与
        # black-forest-labs/FLUX.1-Kontext-dev **都不在目录内**，后者实测 FAILED。
        drawModelId: ""
        # 单次出图总预算（毫秒），含提交与全部轮询。上界 1800000（30 分钟），
        # 严格高于这个默认值——它**不是**上限。别调小：实测最慢一次 859s 才成功，
        # 而超时放弃**不等于**任务死亡（上游会继续跑），把预算压到 5 分钟曾实测击穿。
        drawTimeoutMs: 900000
        # 单次出图**工具调用**愿意等的时间（毫秒）。与上面那条是两件事：那是
        # 「这张图值不值得继续等」的总放弃线，这是「一轮对话被占住多久」。
        # 等不到就返回 pending + jobId，agent 带 jobId 再调用即可续查。
        # 实际取值夹在 10s 与上面那条 drawTimeoutMs 之间（等待超过总放弃线没有意义）。
        drawWaitMs: 90000
        # 追加可信 Host 名（默认 localhost / 127.0.0.1 / ::1，只增不替）。
        # allowedHosts: []
