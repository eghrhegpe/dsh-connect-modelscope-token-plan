# dsh-connect-modelscope-token-plan — the bundle's own patch layer.
#
# 在 Plugins 页的插件卡里展示魔搭 API-Inference 免费额度的**本地用量面板**，
# 并可选把魔搭注册成 OpenAI 兼容 LLM provider。以下全是普通配置：在这里改
# （或在 profile 的 cordis.patch.yml 里覆盖同 id 字段）后重装/重载生效。
#
# 魔搭访问令牌（个人中心「访问令牌」，形如 ms-…）不在这里配置：插件默认读
# DSH 凭据服务里的 MODELSCOPE_API_KEY 引用（本机已存在），env
# MODELSCOPE_API_KEY 是回退。见 docs/SPIKE.md 与 README.md。
- insert:
    - id: dsh-connect-modelscope-token-plan
      name: dsh-connect-modelscope-token-plan
      config:
        # OpenAI 兼容推理源站（模型目录 + 探测/计数）。平台搬端点时才需要动。
        apiBase: https://api-inference.modelscope.cn/v1
        # 站点源站，只用于面板里的外链（访问令牌页 / 文档页）。
        siteBase: https://modelscope.cn
        # ------------------------------------------------------------------
        # 面板头条是**官方魔粒余额**（balance 路由，真实值），所以这里**没有**
        # 额度常数：官方改按「魔粒」计费后，次数口径的「每日 N 次 / 推算剩余」
        # 是社区快照而非官方数据，与魔粒余额并排展示会误导（README「三条事实」
        # 第 2 条）。早期版本里的 dailyQuotaTotal / dailyQuotaPerModel 已随之
        # 删除——留着它们只会让人以为面板能算「还剩几次」，而它算不出。
        # 本地计数的独家价值在分布 / 趋势 / 429 事件流，不在「离上限多远」。
        # ------------------------------------------------------------------
        # 本地趋势保留天数（插件私有状态文件里的天桶数量，与上游无关）。
        trendDays: 14
        # Host 侧对 /v1/models 的缓存秒数；面板脚注直接引用此值。上界 600。
        cacheSeconds: 60
        # 面板轮询间隔，由 Host 下发、面板跟随。上界 3600（1 小时）。
        # ⚠️ 别把这两个值调大到「几小时」：pollSeconds × 1000 超过 2^31-1 ms 时
        # Node 会把 setInterval 的延时**钳到 1ms**（TimeoutOverflowWarning），插件
        # 于是变成每毫秒打一次魔搭目录。上界是硬夹的，越界值会被拉回上限。
        pollSeconds: 30
        # 单次魔搭请求超时（毫秒）。上界 600000（10 分钟）——同样是硬夹。
        inferenceTimeoutMs: 30000
        # ------------------------------------------------------------------
        # 把魔搭注册成 DSH 的 LLM provider（id `modelscope-token-plan`，直连
        # apiBase，OpenAI 兼容）。默认关（opt-in，与姊妹插件一致）；面板「模型」
        # tab 的「接入为 DSH 模型」开关可随时翻转，面板保存值优先于这里的默认。
        # 注册后魔搭模型进入 DSH 模型选择器。
        #
        # 计数范围：注册开关打开后，DSH 的魔搭对话经本插件的适配器出去，每一次
        # 调用与每一条 429/错误事件都由 src/host/usage-observer.ts 在流的出口
        # 记进同一个 usage-store——所以面板「额度」tab 的本地计数覆盖**全部 DSH
        # 魔搭调用**，不只反映面板自身的探针。直连魔搭的其它客户端仍不计入
        # （本插件看不见它们），消耗总量以官方魔粒余额为准。
        #
        # 已知偏差方向是**少记**：peer 的重试在同一条流内部重发，观察器只看到
        # 一条流。详见 src/host/usage-observer.ts 文件头与 README「诚实声明」。
        registerProvider: false
        # 追加可信 Host 名（默认 localhost / 127.0.0.1 / ::1，只增不替）。
        # allowedHosts: []
