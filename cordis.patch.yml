# dsh-connect-modelscope-token-plan — the bundle's own patch layer.
#
# 在 Plugins 页的插件卡里展示魔搭 API-Inference 免费额度的**本地用量面板**，
# 并可选把魔搭注册成 OpenAI 兼容 LLM provider。以下全是普通配置：在这里改
# （或在 profile 的 cordis.patch.yml 里覆盖同 id 字段）后重装/重载生效。
#
# 魔搭访问令牌（个人中心「访问令牌」，形如 ms-…）不在这里配置：插件默认读
# DSH 凭据服务里的 MODELSCOPE_API_KEY 引用（本机已存在），env
# MODELSCOPE_API_KEY 是回退。见 docs/SPIKE.md 与 README.md。
- insert:
    - id: dsh-connect-modelscope-token-plan
      name: dsh-connect-modelscope-token-plan
      config:
        # OpenAI 兼容推理源站（模型目录 + 探测/计数）。平台搬端点时才需要动。
        apiBase: https://api-inference.modelscope.cn/v1
        # 站点源站，只用于面板里的外链（访问令牌页 / 文档页）。
        siteBase: https://modelscope.cn
        # ------------------------------------------------------------------
        # 额度常数：魔搭没有余额查询接口（docs/SPIKE.md 实测无任何限流响应头），
        # 面板「剩余」= 配置常数 − 本地计数。规则漂移史（1000→500→实名后 2000，
        # 单模型约 500/天）只进配置、不进代码：官方调整时改这里即可。
        dailyQuotaTotal: 2000
        dailyQuotaPerModel: 500
        # ------------------------------------------------------------------
        # 本地趋势保留天数（插件私有状态文件里的天桶数量，与上游无关）。
        trendDays: 14
        # Host 侧对 /v1/models 的缓存秒数；面板脚注直接引用此值。
        cacheSeconds: 60
        # 面板轮询间隔，由 Host 下发、面板跟随。
        pollSeconds: 30
        # 单次魔搭请求超时（毫秒）。
        inferenceTimeoutMs: 30000
        # ------------------------------------------------------------------
        # 第三步（对齐姊妹插件）：直接注册 OpenAI 兼容 provider（id
        # `modelscope-token-plan`，直连 apiBase）。v0.1 未实现，占位默认关。
        registerProvider: false
        # 追加可信 Host 名（默认 localhost / 127.0.0.1 / ::1，只增不替）。
        # allowedHosts: []
